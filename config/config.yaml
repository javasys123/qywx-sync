storage:
  base_path: ./downloads
  image_path: ./downloads/images
  video_path: ./downloads/videos
  naming:
    use_timestamp: true
    prefix: note_
  auto_cleanup_days: 3
logging:
  level: INFO
  file: ./logs/sync.log
  rotation: 10 MB
  retention: 10 days
  format: '{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}'
wechat:
  note_only: true
  image_types:
  - .jpg
  - .jpeg
  - .png
  - .gif
  - .bmp
  - .webp
  video_types:
  - .mp4
  - .mov
  - .avi
  - .mkv
  max_image_size: 20
  max_video_size: 100
  image_quality: 85
  compress_video: false
retry:
  max_attempts: 3
  delay_seconds: 5
  backoff_factor: 2
network:
  timeout: 30
  verify_ssl: true
  proxy: null
upload:
  enabled: true
  api_url: https://api.chaopaiclub.cn/wx-item-register/syncAddByContent
  timeout: 120
  auto_upload: true
scheduler:
  enabled: true
  interval_seconds: 60
  mode: interval
  cron: '*/1 * * * *'
