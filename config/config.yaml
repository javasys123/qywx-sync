# 企业微信配置示例
# 复制此文件为 config.yaml 并填入真实的配置信息

qywx:
  # 发送模式: app(应用消息)
  send_mode: "app"

  # 企业ID (在企业微信管理后台获取)
  corp_id: "YOUR_CORP_ID"

  # 应用密钥 (创建应用后获取)
  corp_secret: "YOUR_CORP_SECRET"

  # 应用ID (创建应用后获取)
  agent_id: 1000002

  # === 会话存档配置 ===
  # 会话存档应用 Secret (从企业微信后台获取)
  finance_secret: "YOUR_FINANCE_SECRET"

  # RSA 私钥 (用于解密会话存档消息)
  # 请将私钥内容粘贴在这里,保持格式:
  # finance_private_key: |
  #   -----BEGIN RSA PRIVATE KEY-----
  #   MIIE... (完整的私钥内容)
  #   -----END RSA PRIVATE KEY-----
  finance_private_key: "YOUR_RSA_PRIVATE_KEY"

  # === 回调配置 (用于接收消息) ===
  callback_token: "YOUR_CALLBACK_TOKEN"
  callback_aes_key: "YOUR_CALLBACK_AES_KEY"
  callback_url: "https://your-domain.com/callback"

  # 消息接收人 (企业微信账号,可以是多个)
  # 格式: userid1|userid2|userid3
  # 特殊值: @all 表示发送给所有人
  touser: "@all"

  # API 地址
  media_upload_url: "https://qyapi.weixin.qq.com/cgi-bin/media/upload"
  message_send_url: "https://qyapi.weixin.qq.com/cgi-bin/message/send"
  access_token_url: "https://qyapi.weixin.qq.com/cgi-bin/gettoken"

# 存储配置
storage:
  base_path: "./downloads"
  # 自动清理(天) - 清理3天前的图片和视频文件
  auto_cleanup_days: 3

# 调度器配置
scheduler:
  enabled: true
  interval_seconds: 60  # 同步间隔(秒)
  mode: interval        # 调度模式: interval(间隔) / cron(定时)
  cron: "*/1 * * * *"   # Cron表达式(当mode为cron时使用)

# 日志配置
logging:
  level: "INFO"
  file: "./logs/sync.log"
  rotation: "10 MB"
  retention: "10 days"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"

# 微信笔记处理配置
wechat:
  # 是否只处理笔记消息 (true: 只处理笔记, false: 处理所有消息类型)
  note_only: true

  image_types:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".bmp"
    - ".webp"

  video_types:
    - ".mp4"
    - ".mov"
    - ".avi"
    - ".mkv"

  max_image_size: 20    # MB
  max_video_size: 100   # MB
  image_quality: 85
  compress_video: false

# 重试配置
retry:
  max_attempts: 3
  delay_seconds: 5
  backoff_factor: 2

# 网络配置
network:
  timeout: 30
  verify_ssl: true
  proxy: null

# 上传配置
upload:
  # 是否启用上传功能
  enabled: true

  # API 接口地址
  api_url: "https://your-api.com/upload"

  # 请求超时时间(秒)
  timeout: 120

  # 自动上传(同步后自动上传)
  auto_upload: true
